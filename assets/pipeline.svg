<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"/><stop offset="1" stop-color="#24243e"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f5ff"/><stop offset="1" stop-color="#ff5fd2"/></linearGradient>
    <clipPath id="c"><rect width="900" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="320" fill="url(#bg)"/>
  </g>
  <text x="450" y="42" text-anchor="middle" font-size="20" font-weight="600" fill="#e2e8f0">End-to-End ML Pipeline</text>

  <!-- connector -->
  <path id="flow" d="M 85 165 H 815" stroke="url(#line)" stroke-width="2.5" fill="none" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" values="28;0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <circle r="6" fill="#00f5ff"><animateMotion dur="5s" repeatCount="indefinite" path="M 85 165 H 815"/></circle>
  <circle r="6" fill="#ff5fd2"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M 85 165 H 815"/></circle>

  <g font-size="14" fill="#f1f5f9" text-anchor="middle">
    <!-- nodes -->
    <g><rect x="20" y="110" width="130" height="110" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".3"/>
       <text x="85" y="150" font-size="26">🗄️</text><text x="85" y="178" font-weight="600">Data</text><text x="85" y="198" font-size="11" fill="#94a3b8">SQL · CSV · APIs</text>
       <animate attributeName="opacity" values=".7;1;.7" dur="6s" repeatCount="indefinite"/></g>
    <g><rect x="170" y="110" width="130" height="110" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".3"/>
       <text x="235" y="150" font-size="26">🧹</text><text x="235" y="178" font-weight="600">Cleaning</text><text x="235" y="198" font-size="11" fill="#94a3b8">Pandas · NumPy</text>
       <animate attributeName="opacity" values=".7;1;.7" dur="6s" begin="1s" repeatCount="indefinite"/></g>
    <g><rect x="320" y="110" width="130" height="110" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".3"/>
       <text x="385" y="150" font-size="26">📊</text><text x="385" y="178" font-weight="600">EDA &amp; Viz</text><text x="385" y="198" font-size="11" fill="#94a3b8">Seaborn · Matplotlib</text>
       <animate attributeName="opacity" values=".7;1;.7" dur="6s" begin="2s" repeatCount="indefinite"/></g>
    <g><rect x="470" y="110" width="130" height="110" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".3"/>
       <text x="535" y="150" font-size="26">🧠</text><text x="535" y="178" font-weight="600">Modeling</text><text x="535" y="198" font-size="11" fill="#94a3b8">Sklearn · PyTorch · TF</text>
       <animate attributeName="opacity" values=".7;1;.7" dur="6s" begin="3s" repeatCount="indefinite"/></g>
    <g><rect x="620" y="110" width="130" height="110" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".3"/>
       <text x="685" y="150" font-size="26">🎯</text><text x="685" y="178" font-weight="600">Evaluate</text><text x="685" y="198" font-size="11" fill="#94a3b8">Metrics · CV</text>
       <animate attributeName="opacity" values=".7;1;.7" dur="6s" begin="4s" repeatCount="indefinite"/></g>
    <g><rect x="770" y="110" width="110" height="110" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".3"/>
       <text x="825" y="150" font-size="26">🚀</text><text x="825" y="178" font-weight="600">Deploy</text><text x="825" y="198" font-size="11" fill="#94a3b8">Flask · Docker · AWS</text>
       <animate attributeName="opacity" values=".7;1;.7" dur="6s" begin="5s" repeatCount="indefinite"/></g>
  </g>
  <text x="450" y="275" text-anchor="middle" font-size="13" fill="#94a3b8">raw data → insight → model → production</text>
</svg>
