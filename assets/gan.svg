<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a78bfa"/></marker>
    <clipPath id="c"><rect width="900" height="340" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="340" fill="url(#bg)"/>
  </g>
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#e2e8f0">Currently Learning · Generative Adversarial Network</text>
  <g font-size="14" fill="#f1f5f9" text-anchor="middle">
    <rect x="30" y="120" width="130" height="90" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".3"/>
    <text x="95" y="160" font-size="22">🎲</text><text x="95" y="188" font-weight="600">Noise z</text>

    <rect x="220" y="110" width="170" height="110" rx="18" fill="url(#glass)" stroke="#00f5ff" stroke-opacity=".7"/>
    <text x="305" y="150" font-size="24">🎨</text><text x="305" y="178" font-weight="600">Generator</text><text x="305" y="198" font-size="11" fill="#94a3b8">creates fake samples</text>

    <rect x="460" y="110" width="170" height="110" rx="18" fill="url(#glass)" stroke="#ff5fd2" stroke-opacity=".7"/>
    <text x="545" y="150" font-size="24">🕵️</text><text x="545" y="178" font-weight="600">Discriminator</text><text x="545" y="198" font-size="11" fill="#94a3b8">real or fake?</text>

    <rect x="700" y="120" width="170" height="90" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".3"/>
    <text x="785" y="158" font-size="22">✅ / ❌</text><text x="785" y="188" font-weight="600">Prediction</text>

    <rect x="460" y="255" width="170" height="56" rx="16" fill="url(#glass)" stroke="#fff" stroke-opacity=".3"/>
    <text x="545" y="289" font-weight="600">🖼️ Real data</text>
  </g>
  <g stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#a)" stroke-dasharray="6 6">
    <path d="M160 165 H 218"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M390 165 H 458"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M630 165 H 698"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M545 255 V 222"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
  </g>
  <!-- feedback loop -->
  <path d="M 785 212 V 262 H 700 M 305 222 V 262 H 400" stroke="#fbbf24" stroke-width="0" fill="none"/>
  <path id="fb" d="M 545 108 V 80 H 305 V 108" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 6" marker-end="url(#a)">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="425" y="72" text-anchor="middle" font-size="12" fill="#fbbf24">loss gradients (adversarial feedback)</text>
  <circle r="5" fill="#fbbf24"><animateMotion dur="3s" repeatCount="indefinite" path="M 545 108 V 80 H 305 V 108"/></circle>
</svg>
